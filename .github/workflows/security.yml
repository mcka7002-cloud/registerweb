name: Security

# Security gate (ADR 0002). Runs on every PR and push to main, and deploy.yml calls it before every prod
# deploy: production waits on this workflow and there is no input to skip it.
# The repo is public, so logs are public: scans run with redaction and print no secret values.

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  secrets:
    name: secrets (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      - run: gitleaks git --redact --no-banner --exit-code 1 .

  dependencies:
    name: dependencies (pnpm audit, prod deps, high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high

  codeql:
    name: code (CodeQL, fails on high severity)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          output: sarif
      - name: Fail on security severity >= 7.0
        run: |
          python3 - <<'PY'
          import glob, json, sys
          bad = []
          for f in glob.glob("sarif/*.sarif"):
              for run in json.load(open(f))["runs"]:
                  rules = {}
                  for comp in [run["tool"]["driver"], *run["tool"].get("extensions", [])]:
                      for r in comp.get("rules", []):
                          rules[r["id"]] = float(r.get("properties", {}).get("security-severity", 0) or 0)
                  for res in run.get("results", []):
                      sev = rules.get(res.get("ruleId"), 0)
                      if sev >= 7.0:
                          loc = res["locations"][0]["physicalLocation"]
                          bad.append(f'{res["ruleId"]} ({sev}) {loc["artifactLocation"]["uri"]}:{loc.get("region", {}).get("startLine")}')
          print("\n".join(bad) or "no high-severity CodeQL findings")
          sys.exit(1 if bad else 0)
          PY

  database:
    name: database (SQL rule tests, RLS, search_path)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - run: bash packages/db/scripts/test-sql.sh
      - run: bash packages/db/scripts/check-security.sh
