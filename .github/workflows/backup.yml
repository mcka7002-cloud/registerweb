name: Prod DB backup

# Nightly pg_dump of prod → encrypted → private R2 bucket (ADR 0002: Supabase Free has no backups).
# Keys: daily/YYYY-MM-DD.dump.gpg, plus monthly/YYYY-MM.dump.gpg on the 1st. R2 lifecycle rules delete
# daily/ after 30 days and monthly/ after 365 days (set once, see docs/deploy-th.md).
# The repo is PUBLIC, so logs are public: never print the database URL or any dump content.

on:
  schedule:
    - cron: "0 19 * * *" # 02:00 Bangkok
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Install pg_dump 17 (dumps Postgres 15–17)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17 > /dev/null

      - name: Dump and encrypt
        env:
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$PROD_DB_URL" && test -n "$BACKUP_PASSPHRASE"
          /usr/lib/postgresql/17/bin/pg_dump "$PROD_DB_URL" --format=custom --no-owner --no-privileges --file=db.dump
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" --symmetric --cipher-algo AES256 --output db.dump.gpg db.dump
          rm db.dump
          echo "dump size: $(du -h db.dump.gpg | cut -f1)"

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: registerweb-backups
        run: |
          set -euo pipefail
          day=$(TZ=Asia/Bangkok date +%F)
          aws s3 cp db.dump.gpg "s3://$BUCKET/daily/$day.dump.gpg" --endpoint-url "$R2_ENDPOINT" --only-show-errors
          if [ "$(TZ=Asia/Bangkok date +%d)" = "01" ]; then
            aws s3 cp db.dump.gpg "s3://$BUCKET/monthly/$(TZ=Asia/Bangkok date +%Y-%m).dump.gpg" --endpoint-url "$R2_ENDPOINT" --only-show-errors
          fi
