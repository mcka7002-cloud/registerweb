# Supabase CLI (local dev) · รัน `pnpm db:start` ที่ root
project_id = "registerweb"

[api]
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 15

[studio]
port = 54323

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]

[auth.email]
# local dev: ล็อกอินด้วย email + password (ผู้ใช้ทดสอบใน seed.sql) · production ใช้ Google
enable_signup = true
enable_confirmations = false

[auth.external.google]
# ทุก role ล็อกอินด้วย Gmail
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"

[storage]
enabled = true
